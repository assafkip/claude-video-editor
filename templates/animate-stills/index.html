<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1080px; overflow: hidden; background: #0c0c0e; }
      .stage { position: relative; width: 1080px; height: 1080px; }
      .scene { position: absolute; inset: 0; }
      .cam { position: absolute; inset: 0; will-change: transform; }
      .still { width: 100%; height: 100%; object-fit: cover; display: block; }
      .atmo { position: absolute; inset: -12%; pointer-events: none; }
      .atmo-mist { background:
        radial-gradient(42% 30% at 28% 68%, rgba(225,232,238,0.34), transparent 70%),
        radial-gradient(50% 34% at 74% 80%, rgba(208,218,226,0.26), transparent 72%);
        filter: blur(14px); }
      .atmo-rain { background-image: repeating-linear-gradient(
        12deg, rgba(210,222,232,0.0) 0 7px, rgba(210,222,232,0.20) 7px 9px);
        opacity: 0.5; }
      .atmo-light { background: radial-gradient(38% 52% at 50% 38%,
        rgba(255,236,200,0.5), transparent 70%); mix-blend-mode: screen; }
      .vignette { position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(78% 78% at 50% 46%, transparent 58%, rgba(8,8,10,0.55) 100%); }
      .caption { position: absolute; left: 50%; bottom: 7%; transform: translateX(-50%);
        max-width: 86%; padding: 14px 26px; border-radius: 14px;
        background: rgba(10,10,14,0.78); color: #f3efe7;
        font: 600 30px/1.35 -apple-system, "Segoe UI", sans-serif;
        text-align: center; }
      #__end { position: absolute; width: 1px; height: 1px; opacity: 0; }
    </style>
  </head>
  <body>
    <div class="stage" data-composition-id="main" data-width="1080" data-height="1080" data-start="0">
<!-- SCENES:BEGIN (generated by build_scenes.py — do not edit inside) -->
      <div class="scene" id="sc1">
        <div class="cam" id="cam1" data-layout-allow-overflow>
          <img class="still" src="assets/stills/s1.png" alt="" />
        </div>
        <div class="atmo atmo-mist"></div>
      </div>
      <div class="scene" id="sc2">
        <div class="cam" id="cam2" data-layout-allow-overflow>
          <img class="still" src="assets/stills/s2.png" alt="" />
        </div>
        <div class="atmo atmo-light"></div>
      </div>
      <!-- SCENES:END -->
      <div class="vignette"></div>
      <div class="caption" id="cap1">Scene one: a slow push into a still.</div>
      <div class="caption" id="cap2">Scene two: a lateral drift with light.</div>
      <div id="__end"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* TIMELINE:BEGIN (generated by build_scenes.py — do not edit inside) */
      /* scene 1: push-in 0.0-6.0s */
      tl.set("#sc1", { autoAlpha: 1 }, 0);
      tl.fromTo("#cam1", { scale: 1.03 }, { scale: 1.15, duration: 6.00, ease: "none" }, 0.00);
      tl.fromTo("#sc1 .atmo", { xPercent: -6 }, { xPercent: 6, duration: 6.00, ease: "none" }, 0.00);
      /* scene 2: drift-left 6.0-12.0s */
      tl.set("#sc2", { autoAlpha: 0 }, 0);
      tl.to("#sc2", { autoAlpha: 1, duration: 0.45, ease: "power1.inOut" }, 6.00);
      tl.fromTo("#cam2", { scale: 1.08, xPercent: 2.2 }, { scale: 1.08, xPercent: -2.2, duration: 6.00, ease: "none" }, 6.00);
      tl.fromTo("#sc2 .atmo", { xPercent: -25, opacity: 0.0 }, { xPercent: 25, opacity: 0.55, duration: 6.00, ease: "sine.inOut" }, 6.00);
      tl.set("#cap1", { autoAlpha: 0 }, 0);
      tl.to("#cap1", { autoAlpha: 1, duration: 0.3 }, 0.60);
      tl.to("#cap1", { autoAlpha: 0, duration: 0.3 }, 5.10);
      tl.set("#cap2", { autoAlpha: 0 }, 0);
      tl.to("#cap2", { autoAlpha: 1, duration: 0.3 }, 6.60);
      tl.to("#cap2", { autoAlpha: 0, duration: 0.3 }, 11.10);
      /* duration sentinel */
      tl.to("#__end", { autoAlpha: 1, duration: 0.01 }, 11.99);
      /* TIMELINE:END */

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
