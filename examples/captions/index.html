<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: transparent;            /* transparent overlay — webm alpha */
        font-family: "Inter", sans-serif;
      }
      #root { position: absolute; inset: 0; }

      /* Lower-third sits in the lower-left, inside the 982px visible area. */
      .lt {
        position: absolute;
        left: 56px;
        top: 760px;                          /* well within the 982px video height */
        display: flex;
        align-items: stretch;
        opacity: 0;                          /* GSAP reveals */
      }
      .lt-accent {
        width: 7px;
        border-radius: 6px 0 0 6px;
        background: linear-gradient(180deg, #18b89f, #0e7c6c);
        box-shadow: 0 0 18px rgba(24,184,159,0.55);
      }
      .lt-body {
        background: rgba(13, 22, 28, 0.92);  /* dark pill — reads over the light UI */
        border: 1px solid rgba(24,184,159,0.25);
        border-left: none;
        border-radius: 0 12px 12px 0;
        padding: 18px 30px 20px 26px;
        max-width: 1080px;
        backdrop-filter: blur(2px);
      }
      .lt-kicker {
        font-family: "JetBrains Mono", monospace;
        font-size: 21px; font-weight: 600;
        letter-spacing: 0.32em;
        color: #2fe0c4;
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      .lt-text {
        font-size: 46px; font-weight: 700;
        letter-spacing: -0.01em; line-height: 1.06;
        color: #ffffff;
        text-shadow: 0 2px 18px rgba(0,0,0,0.5);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
      data-composition-variables='{"num":"01","label":"INTAKE","text":"Drop raw intel. Get the network."}'
    >
      <div id="lt" class="lt clip" data-start="0" data-duration="5" data-track-index="1">
        <div class="lt-accent"></div>
        <div class="lt-body">
          <div class="lt-kicker"><span id="cap-num">01</span> &middot; <span id="cap-label">INTAKE</span></div>
          <div class="lt-text" id="cap-text">Drop raw intel. Get the network.</div>
        </div>
      </div>
    </div>

    <script>
      // Pull per-render text from --variables (falls back to the data- defaults).
      (() => {
        const v = (window.__hyperframes && window.__hyperframes.getVariables)
          ? window.__hyperframes.getVariables() : {};
        if (v.num)   document.getElementById("cap-num").textContent   = v.num;
        if (v.label) document.getElementById("cap-label").textContent = v.label;
        if (v.text)  document.getElementById("cap-text").textContent  = v.text;
      })();

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Slide up + fade in, hold, fade out — readable at 1x.
      tl.fromTo("#lt", { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 0.0);
      tl.to("#lt", { opacity: 0, y: -12, duration: 0.45, ease: "power2.in" }, 4.45);
      tl.to({}, { duration: 5 }, 0);   // duration anchor
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
